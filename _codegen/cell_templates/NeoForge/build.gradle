plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

version = "${mod_version}+${mc_line}-neoforge"
group = 'com.kishku7.fillmapcoordinates'
base { archivesName = '@MOD_ID@' }

java.toolchain.languageVersion = JavaLanguageVersion.of(@JDK@)

// D16 single-source: compile ONLY the cog-generated tree (scripts\cog-gen.ps1). No shared_* srcDirs.
sourceSets.main.java.srcDirs = ['gen/src/main/java']
sourceSets.main.resources.srcDirs = ['src/main/resources', 'gen/src/main/resources']

neoForge {
    version = project.neo_version
    runs {
        server { server(); programArgument '--nogui' }
        client { client() }
    }
    mods {
        fillmapcoordinates { sourceSet(sourceSets.main) }
    }
}

dependencies {
    // Mixin annotations only (compile classpath). NO annotation processor: mojmap-native runtime, no refmap.
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

processResources {
    def ep = [mod_version: mod_version, mcRange: project.mc_range, neoforgeRange: project.neoforge_range]
    inputs.properties(ep)
    filesMatching('META-INF/neoforge.mods.toml') { expand(ep) }
}

jar {
    manifest {
        attributes 'MixinConfigs': 'fillmapcoordinates.mixins.json'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = @JDK@
    options.compilerArgs << '-Xlint:all'   // D11: zero-warning bar on every cell.
}
