plugins {
    id '@PLUGIN_ID@' version '@PLUGIN_VER@'
}

version = "${project.mod_version}+${project.mc_line}-fabric"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// D16 single-source: compile ONLY the cog-generated tree (scripts\cog-gen.ps1). No shared_* srcDirs.
sourceSets.main.java.srcDirs = ['gen/src/main/java']
sourceSets.main.resources.srcDirs = ['src/main/resources', 'gen/src/main/resources']

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
@FABRIC_DEPS@
}

processResources {
    inputs.properties(["version": project.version, "mcDep": project.mc_dep])
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mcDep": project.mc_dep
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = @JDK@
    it.options.compilerArgs << '-Xlint:all'   // D11: zero-warning bar on every cell.
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_@JDK@
    targetCompatibility = JavaVersion.VERSION_@JDK@
}
